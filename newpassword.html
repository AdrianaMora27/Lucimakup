<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Lucimakeup Store</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
    <style>
        :root {
            --blanco: #ffffff;
            --oscuro: #212121;
            --morado: #9C27B0;
            --morado-oscuro: #89119D;
            --rosa-fuerte: #ff69b4;
            --Blanco-crema: #FFF8F5;
            --fuentePrincipal: "Staatliches", sans-serif;
        }

        html {
            box-sizing: border-box;
            font-size: 62.5%;
        }

        *, *:before, *::after {
            box-sizing: inherit;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--rosa-fuerte);
            font-size: 1.6rem;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .contenedor-recuperar {
            max-width: 45rem;
            background-color: var(--Blanco-crema);
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
            width: 90%;
        }

        h1 {
            font-family: var(--fuentePrincipal);
            color: var(--morado-oscuro);
            text-align: center;
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .instrucciones {
            text-align: center;
            color: var(--oscuro);
            font-size: 1.5rem;
            margin-bottom: 2.5rem;
            line-height: 1.4;
        }

        .campo {
            margin-bottom: 2rem;
        }

        .campo label {
            display: block;
            margin-bottom: .8rem;
            font-weight: bold;
            color: var(--oscuro);
        }

        .campo input {
            width: 100%;
            padding: 1.2rem;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
            font-size: 1.5rem;
        }

        .boton {
            width: 100%;
            background-color: var(--morado);
            color: var(--blanco);
            border: none;
            padding: 1.2rem;
            font-family: var(--fuentePrincipal);
            font-size: 2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .boton:hover {
            background-color: var(--morado-oscuro);
        }

        .acciones {
            margin-top: 2rem;
            text-align: center;
        }

        .acciones a {
            color: var(--morado-oscuro);
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .acciones a:hover {
            text-decoration: underline;
        }

        /* Estilo para mensajes de alerta dinámicos */
        .alerta {
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
        }
        .alerta.error {
            background-color: #ffebee;
            color: #c62828;
        }
        .alerta.exito {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="contenedor-recuperar">
        <h1>Nueva Contraseña</h1>
        <p class="instrucciones">Por favor, ingresa tu nueva contraseña para la cuenta asociada.</p>
        
        <div id="mensajeAlerta"></div>

        <form id="formNuevaPassword">
            <div class="campo">
                <label for="password">Nueva Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu nueva contraseña" required>
            </div>

            <div class="campo">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu nueva contraseña" required>
            </div>
            
            <button type="submit" class="boton">Actualizar Contraseña</button>
        </form>

        <div class="acciones">
            <a href="login.html">← Ir al Iniciar Sesión</a>
        </div>
    </div>
<!---SCRIPT JAVA-->
<script src="js/newpassword.js"></script>
   
</body>
</html>
