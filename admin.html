<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Lucimakeup Store</title>
    <link rel="stylesheet" href="css/style.css"> <!-- Ajusta si tu CSS tiene otra ruta -->
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff0f3; color: #333; margin: 0; padding: 0; }
        header { background-color: #880e2f; color: white; padding: 2rem; text-align: center; }
        .admin-container { max-width: 1100px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #880e2f; border-bottom: 2px solid #880e2f; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 3rem; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: span 2; }
        label { font-weight: bold; margin-bottom: 0.5rem; color: #555; }
        input, textarea { padding: 1rem; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1.4rem; }
        button.btn-guardar { grid-column: span 2; background-color: #880e2f; color: white; border: none; padding: 1.2rem; font-size: 1.6rem; border-radius: 0.5rem; cursor: pointer; transition: background 0.3s; }
        button.btn-guardar:hover { background-color: #5a081e; }
        table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
        th, td { padding: 1.2rem; text-align: left; border-bottom: 1px solid #ddd; font-size: 1.4rem; }
        th { background-color: #880e2f; color: white; }
        .acciones-btn { display: flex; gap: 1rem; }
        .btn-editar { background-color: #ffc107; border: none; padding: 0.6rem 1.2rem; border-radius: 0.4rem; cursor: pointer; font-weight: bold; }
        .btn-eliminar { background-color: #d32f2f; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.4rem; cursor: pointer; font-weight: bold; }
        .volver-tienda { display: inline-block; margin-bottom: 2rem; color: #880e2f; text-decoration: none; font-weight: bold; font-size: 1.5rem; }
    </style>
</head>
<body>

    <header>
        <h1>Panel de Gestión - Lucimakeup Store</h1>
        <p>Control de Inventario y Productos (Módulo Admin)</p>
    </header>

    <div class="admin-container">
        <a href="index.html" class="volver-tienda">← Volver a la Tienda</a>

        <h2>Agregar Nuevo Producto</h2>
        <form id="form-producto">
            <input type="hidden" id="idProducto">
            
            <div class="form-group">
                <label for="Nombre_Producto">Nombre del Producto:</label>
                <input type="text" id="Nombre_Producto" required>
            </div>

            <div class="form-group">
                <label for="Precio_Producto">Precio ($):</label>
                <input type="number" step="0.01" id="Precio_Producto" required>
            </div>

            <div class="form-group">
                <label for="Stock_Producto">Stock (Cantidad):</label>
                <input type="number" id="Stock_Producto" required>
            </div>

            <div class="form-group">
                <label for="Categoria_idCategoria">ID Categoría:</label>
                <input type="number" id="Categoria_idCategoria" required>
            </div>

            <div class="form-group full">
                <label for="imagen">URL de la Imagen:</label>
                <input type="text" id="imagen" placeholder="images/producto.jpg">
            </div>

            <div class="form-group full">
                <label for="descripcion_producto">Descripción:</label>
                <textarea id="descripcion_producto" rows="3" required></textarea>
            </div>

            <button type="submit" class="btn-guardar" id="btn-submit-text">Guardar Producto</button>
        </form>

        <h2>Inventario Actual en Base de Datos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Acciones</th>
                </tr>
            <thead id="tabla-productos-body">
                <!-- Los productos se cargan dinámicamente con JavaScript -->
            </thead>
        </table>
    </div>

    <!-- Script de control del CRUD de Admin -->
    <script src="js/admin.js"></script>
</body>
</html>
