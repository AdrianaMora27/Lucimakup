<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Lucimakeup Store</title>
    <link rel="stylesheet" href="css/normalize.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff0f3; color: #333; margin: 0; padding: 0; }
        header { background-color: #880e2f; color: white; padding: 2rem; text-align: center; }
        .admin-container { max-width: 1100px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #880e2f; border-bottom: 2px solid #880e2f; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 3rem; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 0.5rem; color: #555; }
        input { padding: 1rem; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1.4rem; }
        .botones { grid-column: span 2; display: flex; gap: 1rem; }
        button.btn-guardar { flex: 1; background-color: #880e2f; color: white; border: none; padding: 1.2rem; font-size: 1.6rem; border-radius: 0.5rem; cursor: pointer; }
        button.btn-guardar:hover { background-color: #5a081e; }
        button.btn-cancelar { background-color: #999; color: white; border: none; padding: 1.2rem 2rem; font-size: 1.6rem; border-radius: 0.5rem; cursor: pointer; display: none; }
        .buscador { margin-bottom: 1rem; width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1.2rem; text-align: left; border-bottom: 1px solid #ddd; font-size: 1.4rem; }
        th { background-color: #880e2f; color: white; }
        .acciones-btn { display: flex; gap: 1rem; }
        .btn-editar { background-color: #ffc107; border: none; padding: 0.6rem 1.2rem; border-radius: 0.4rem; cursor: pointer; font-weight: bold; }
        .btn-eliminar { background-color: #d32f2f; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.4rem; cursor: pointer; font-weight: bold; }
        .volver-tienda { display: inline-block; margin-bottom: 2rem; margin-right: 2rem; color: #880e2f; text-decoration: none; font-weight: bold; font-size: 1.5rem; }
        .ayuda { font-size: 1.2rem; color: #777; margin-top: 0.4rem; }
    </style>
</head>
<body>
    <header>
        <h1>Panel de Gestión - Lucimakeup Store</h1>
        <p>Gestión de Usuarios (Módulo Admin)</p>
    </header>
    <div class="admin-container">
        <a href="index.html" class="volver-tienda">← Volver a la Tienda</a>
        <a href="admin.html" class="volver-tienda">← Gestionar productos</a>

        <h2 id="titulo-form">Agregar Nuevo Usuario</h2>
        <form id="form-usuario" autocomplete="off">
            <input type="hidden" id="idCliente">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" maxlength="200" required>
            </div>
            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" maxlength="50">
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" maxlength="15">
            </div>
            <div class="form-group">
                <label for="email">Correo:</label>
                <input type="email" id="email" maxlength="200" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" maxlength="50" autocomplete="new-password">
                <span class="ayuda" id="ayuda-password">Obligatoria (6 a 50 caracteres).</span>
            </div>
            <div class="botones">
                <button type="submit" class="btn-guardar" id="btn-submit-text">Guardar Usuario</button>
                <button type="button" class="btn-cancelar" id="btn-cancelar">Cancelar edición</button>
            </div>
        </form>

        <h2>Usuarios Registrados</h2>
        <input type="search" id="buscador" class="buscador" placeholder="Buscar por nombre, apellido o correo">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Registro</th>
                    <th>Pedidos</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-usuarios-body"></tbody>
        </table>
    </div>
    <script src="js/adminAuth.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
