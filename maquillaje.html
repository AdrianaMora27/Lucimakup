<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquillaje - Lucimakeup Store</title>
    <link rel="stylesheet" href="css/normalize.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Akt:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Krub:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Staatliches&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
            VARIABLES DE DISEÑO Y PALETA DE COLORES
           ========================================== */
        :root { 
            --blanco: #ffffff;
            --oscuro: #212121;
            --primario: #ffc107;
            --gris: #757575;
            --rosa-claro: #ffb6c1;
            --rosa-fuerte: #ff69b4;
            --rojo-oscuro: #880e2f;
            --Gris-claro: #dfe9f3;
            --Blanco-crema: #FFF8F5;
            --Gris-arena: #F4F4F2;
            --Beige-calido: #F9F5EB;
            --Azul-lavanda: #D6E4F0;
            --Verde-menta: #E2F0D9;
            --Rosa-sutil: #FCE4EC;
            --morado: #9C27B0;
            --morado-oscuro: #89119D;
            --secundario-oscuro: rgb(255,187,2);
            --negro: #000;
            --fuentePrincipal: "Staatliches", sans-serif;
        }

        /* ==========================================
            CONFIGURACIÓN GLOBAL Y RESET
           ========================================== */
        html { 
            box-sizing: border-box;
            font-size: 62.5%;
        }
        
        *, *:before, *::after {
            box-sizing: inherit;
        }

        body { 
            background-color: var(--rosa-fuerte);
            font-size: 1.6rem;
            line-height: 1.5;
            margin: 0;
        }

        p { 
            font-size: 1.8rem;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--negro);
        }

        a { 
            text-decoration: none;
        }

        img { 
            width: 100%;
            display: block;
        }

        .contenedor { 
            max-width: 120rem;
            margin: 0 auto;
            padding: 0 2rem;
        }

        h1, h2, h3 { 
            text-align: center;
            color: var(--oscuro);
            font-family: var(--fuentePrincipal);
        }

        h1 { font-size: 4rem; }
        h2 { font-size: 3.2rem; }
        h3 { font-size: 2.4rem; }

        /* ==========================================
            ESTILOS DE CABECERA Y NAVEGACIÓN
           ========================================== */
        .header { 
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .header__logo { 
            margin: 2rem 0;
            max-width: 25rem;
        }

        .navegacion { 
            background-color: var(--Blanco-crema);
            padding: 1rem 0;
            display: flex;
            justify-content: center; 
            gap: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .navegacion__enlace {
            font-family: var(--fuentePrincipal);
            color: var(--negro);
            font-size: 2.2rem;
            transition: color 0.3s ease;
        }

        .navegacion__enlace:hover {
            color: var(--morado);
        }

        /* ==========================================
            SECCIONES Y TARJETAS DE PRODUCTOS
           ========================================== */
        .subcategoria__titulo { 
            font-family: var(--fuentePrincipal);
            color: var(--morado);
            font-size: 2.4rem;
            text-align: left;
            margin: 3rem 0 1.5rem 0;
            border-bottom: .2rem solid var(--rosa-claro);
            padding-bottom: .5rem;
        }

        .grid-productos { 
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 3rem;
            margin-bottom: 3rem;
            align-items: stretch;
        }

        @media (min-width: 768px) {
            .grid-productos { 
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .tarjeta-producto { 
            background-color: var(--Blanco-crema);
            border-radius: 1rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform .3s ease;
            box-shadow: 0px 5px 10px rgba(0,0,0,0.08);
        }

        .tarjeta-producto:hover {
            transform: translateY(-.5rem);
        }

        .tarjeta-producto__imagen { 
            height: 22rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--Rosa-sutil);
            overflow: hidden;
        }

        .tarjeta-producto__imagen img { 
            width: 100%;
            height: 100%;
            object-fit: contain; 
            padding: 1.5rem;    
            background-color: var(--Rosa-sutil);
        }

        .tarjeta-producto__info { 
            padding: 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .tarjeta-producto__nombre { 
            font-family: var(--fuentePrincipal);
            font-size: 2rem;
            color: var(--oscuro);
            margin-bottom: .5rem;
        }

        .tarjeta-producto__precio {
            font-family: var(--fuentePrincipal);
            font-size: 2.2rem;
            color: var(--morado-oscuro);
            margin: 0.5rem 0 1.5rem 0;
        }

        .tarjeta-producto__boton { 
            display: inline-block;
            background-color: var(--primario);
            color: var(--negro);
            font-family: var(--fuentePrincipal);
            font-size: 1.6rem;
            padding: 1rem 2rem;
            border-radius: .5rem;
            transition: background-color .3s ease, transform .2s ease;
            text-transform: uppercase;
        }

        .tarjeta-producto__boton:hover { 
            background-color: var(--secundario-oscuro);
            color: var(--blanco);
            transform: scale(1.03);
        }

        /* ==========================================
            PIE DE PÁGINA (FOOTER)
           ========================================== */
        .footer { 
            background-color: var(--Blanco-crema);
            padding: 1.5rem 0;
            margin-top: 4rem;
        }

        .footer__texto { 
            text-align: center;
            font-family: var(--fuentePrincipal);
            font-size: 2.2rem;
        }

        /**BARRA DE BUSQUEDA*/
        .buscador-header {
            display: inline-flex;
            align-items: center;
            margin-left: 15px;
        }

        .buscador-header input {
            padding: 6px 12px;
            border: 1px solid #dcdcdc;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .buscador-header input:focus {
            border-color: #e91e63;
            box-shadow: 0 0 5px rgba(233, 30, 99, 0.3);
        }

        .buscador-header button {
            background: none;
            border: none;
            cursor: pointer;
            margin-left: -30px;
        }
    </style>
</head>

<body>
    <!-- CABECERA INSTITUCIONAL -->
    <header class="header">
        <a href="#" id="btn-cerrar-sesion" class="navegacion__enlace" style="color: var(--rojo-oscuro); font-size: 1.4rem; margin-top: 1rem;">Cerrar Sesión</a>
        <a href="index.html">
            <img class="header__logo" src="img/logolucistore.png" alt="Logotipo Lucimakeup Store">
        </a>
    </header>

    <!-- NAVEGACIÓN PRINCIPAL -->
    <nav class="navegacion">
        <a class="navegacion__enlace" href="index.html">Inicio</a>
        <a class="navegacion__enlace" href="categorias.html">Catálogo</a>
        <a class="navegacion__enlace" href="nosotros.html">Nosotros</a>
        <div class="buscador-header">
            <input type="text" id="inputBuscador" placeholder="Buscar productos...">
            <button type="button" aria-label="Buscar">🔍</button>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL: MAQUILLAJE -->
    <main class="contenedor">
        <h1>Maquillaje</h1>

        <!-- Subcategoría 1: Rostro (Dinámico desde MySQL) -->
        <h2 class="subcategoria__titulo">Rostro</h2>
        <div class="grid-productos" id="grid-rostro">
            <!-- Los productos se cargarán automáticamente desde el servidor -->
        </div>

        <!-- Subcategoría 2: Ojos (Dinámico desde MySQL) -->
        <h2 class="subcategoria__titulo">Ojos</h2>
        <div class="grid-productos" id="grid-ojos">
            <!-- Los productos se cargarán automáticamente desde el servidor -->
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        <p class="footer__texto">Frontend Store Lucimakeup - Todos los derechos reservados</p>
    </footer>

    <!-- SCRIPT DE CARGA DINÁMICA DESDE EL BACKEND -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const gridRostro = document.getElementById("grid-rostro");
            const gridOjos = document.getElementById("grid-ojos");

            if (!gridRostro && !gridOjos) return;

            try {
                // Petición al servidor local de Node.js y MySQL
                const respuesta = await fetch("http://localhost:3000/api/productos");
                const resultado = await respuesta.json();
                const productos = Array.isArray(resultado) ? resultado : (resultado.productos || []);

                if (gridRostro) gridRostro.innerHTML = "";
                if (gridOjos) gridOjos.innerHTML = "";

                productos.forEach(prod => {
                    const tarjetaHTML = `
                        <div class="tarjeta-producto" data-id="${prod.idProducto}">
                            <a href="productos.html?id=${prod.idProducto}" class="tarjeta-producto__imagen">
                                <img src="${prod.imagen || 'img/default.jpg'}" alt="${prod.Nombre_Producto}">
                            </a>
                            <div class="tarjeta-producto__info">
                                <h3 class="tarjeta-producto__nombre">${prod.Nombre_Producto}</h3>
                                <p class="tarjeta-producto__precio">$${Number(prod.Precio_Producto).toLocaleString()} COP</p>
                                <a href="productos.html?id=${prod.idProducto}" class="tarjeta-producto__boton">Ver producto</a>
                            </div>
                        </div>
                    `;

                    // Clasificación según el ID de categoría en tu base de datos (ajusta si tus IDs varían)
                    if (prod.Categoria_idCategoria === 1 && gridRostro) {
                        gridRostro.innerHTML += tarjetaHTML;
                    } else if (prod.Categoria_idCategoria === 2 && gridOjos) {
                        gridOjos.innerHTML += tarjetaHTML;
                    }
                });

            } catch (error) {
                console.error("Error al conectar con el servidor local para cargar maquillaje:", error);
            }
        });
    </script>

    <!-- SCRIPTS GENERALES -->
    <script src="js/carrito.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
