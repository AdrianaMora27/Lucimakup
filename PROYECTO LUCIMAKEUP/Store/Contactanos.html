<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuentranos</title>
    <link rel="stylesheet" href="Normalize.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Akt:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Krub:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

    <style>
        :root { 
         --blanco: #ffffff;
            --oscuro: #212121;
            --primario: #ffc107;
            --gris: #757575;
            --rosa-claro: #ffb6c1;
            --rosa-fuerte: #ff69b4;
            --rojo-oscuro: #880e2f;
            --Gris-claro: #dfe9f3;
            --Blanco-crema: #FFF8F5;
            --Gris-arena: #F4F4F2;
            --Beige-calido: #F9F5EB;
            --Azul-lavanda: #D6E4F0;
            --Verde-menta: #E2F0D9;
            --Rosa-sutil: #FCE4EC;




            --fuente-principal: 3.8rem;
    }

.contenedor { 
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 4rem;
    padding: 4rem;
    background-color: var(--rosa-fuerte);
    border-radius: 1rem;
    width: 100%;
    height: 100%;
}

.contacto { 
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 20rem;

}

.iconos { 
    height: 10rem;
    width: 10rem;
    background-color: var(--primario);
    border-color: var(--Blanco-crema);
    border-radius: 50%;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
}
    
.parrafo { 
    line-height: 1.5rem;
    text-align: center;
    font-weight: bold;
    font-size: 1.5rem;
}

.titulo { 
     text-align: center;
    font-weight: bold;
    font-size: 3rem;

}

    </style>

<body>
    <main class="contenedor">
