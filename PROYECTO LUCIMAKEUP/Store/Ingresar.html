<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro como cliente</title>
</head>

<style>
    :root{
            --blanco: #ffffff;
            --oscuro: #212121;
            --primario: #ffc107;
            --gris: #757575;
            --rosa-claro: #ffb6c1;
            --rosa-fuerte: #ff69b4;
            --rojo-oscuro: #880e2f;
            --Gris-claro: #dfe9f3;
            --Blanco-crema: #FFF8F5;
            --Gris-arena: #F4F4F2;
            --Beige-calido: #F9F5EB;
            --Azul-lavanda: #D6E4F0;
            --Verde-menta: #E2F0D9;
            --Rosa-sutil: #FCE4EC;




            --fuente-principal: 3.8rem;
            }

        .boton,
        a {
            background-color: var(--rosa-fuerte);
            color: var(--oscuro);
            padding: 1rem 1rem 1rem 1rem;
            margin: 1rem auto;
            font-size: 1rem;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: .5rem;
            width: fit-content;
            display: block;
            text-align: center;
            justify-content: center;
            border: none;

        }
@media (min-width: 768px) {
    .boton {
        width: auto;

    }
}

    .boton:hover {
        cursor: pointer;

    }
    * { 
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        body { 
        background-color: var(--rosa-fuerte);
        display: flex;
        justify-content: center; /*Alinea los elementos horizontalmente dentro del FLEX, center: alinea los elementos**/
        align-items: center; /*Alinea los elementos verticalmente dentro del FLEX, center: centra los elementos**/
        min-height: 100vh;
    }
    .contenedor-ingresar {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 4rem 0;

    }
    .caja-ingresar { 
        background-color: var(--blanco);
        padding: 4rem;
        border-radius: 1rem;
        width: 45rem;
        text-align: center;

    }

    h1 {
        color: var(--rosa-fuerte);
        font-size: 3rem;
        margin-bottom: 1rem;

    }

    p { 
        color: var(--oscuro);
        margin-bottom: 2rem;
    }

    .campo { 
        display: flex;
        flex-direction: column;
        text-align: left;
        margin-bottom: 1.5rem;

    }

    label { 
        color: var(--oscuro);
        font-weight: bold;
        margin-bottom: 0.5rem;
    }
    input { 
        padding: 1rem;
        border: 2px solid var(--rosa-fuerte);
        border-radius: 0.5rem;
        font-size: 1,4rem;
    }

    a { 
        display: block;
        margin-top: 1rem;
        color: var(--oscuro);
        text-decoration: none;
        font-size: 1.3rem;

    }
</style>
<body>
    <div class="contenedor-ingresar">
        <div class="caja-ingresar">
            <h1>LUCIMAKEUP23</h1>
            <p>Completa tus datos</p>
            <form>
                <div class="campo">
                    <label form="nombres">Nombres</label>
                    <input type="text" id="Nombres" placeholder="Ingresa tus nombres">
                </div>
            
                <div class="campo">
                    <label form="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" placeholder="Ingresa tus apellidos">
                </div>

                <div class="campo">
                    <label form="cedula">Cédula</label>
                    <input type="number" id="cedula" placeholder="Ingresa documento de identidad">

                </div>
                
                <div class="campo">
                    <label form="fecha">Fecha de nacimiento</label>
                    <input type="date" id="fecha">
                </div>

                <div class="campo">
                    <label form="telefono">Teléfono</label>
                    <input type="number" id="telefono" placeholder="Ingresa numero de celular">
                </div>
            <div class="campo">
                <label form="correo">Correo eléctronico</label>
                <input type="text" id="correo" placeholder="Ingresa tu correo eléctronico">
            </div>
            
            <div>
            <input class="boton" type="submit" value="Enviar">
            </div>
            
            <a href="login.html">Volver al inicio</a>

           

            </form>
        </div>
    </div>

    <script src="JS/carrito.js"></script>
    
</body>
</html>
